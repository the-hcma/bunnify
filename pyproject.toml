[project]
name = "bunnify"
version = "0.5.0"
description = "Smart bookmark manager and URL shortcut system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asgiref==3.12.1",
    "click>=8.4.2",
    "django>=6.0.7",
    "jsonschema>=4.26.0",
    "packaging==26.2",
    "pathspec==1.1.1",
    "platformdirs>=4.11.0",
    "prompt-toolkit>=3.0.53",
    "rpds-py>=2026.6.3",
    "typing-extensions==4.16.0",
]

[project.scripts]
bunnify = "app.cli:main"
bunnify-server = "app.server_cli:main"

[project.urls]
Changelog = "https://github.com/the-hcma/bunnify/blob/main/CHANGELOG.md"
"Chrome / Edge setup" = "https://github.com/the-hcma/bunnify/blob/main/CHROME_SETUP.md"
Homepage = "https://github.com/the-hcma/bunnify"
Issues = "https://github.com/the-hcma/bunnify/issues"
Repository = "https://github.com/the-hcma/bunnify"
"Server setup" = "https://github.com/the-hcma/bunnify/blob/main/docs/LOCAL.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "bookmarks"]

[tool.hatch.build.targets.sdist]
packages = ["app", "bookmarks"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.1",
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
exclude = ["**/migrations", "**/.venv", "**/venv"]
# Django has dynamic attributes and patterns that don't match strict typing
reportAttributeAccessIssue = "none"
reportIndexIssue = "none"
reportCallIssue = "none"
reportOptionalMemberAccess = "none"
reportArgumentType = "none"  # Django HttpResponse accepts str, pyright thinks bytes

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["**/migrations"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
# Replaces black/isort-adjacent flake8 E/F and isort (I). Pyright remains for types.
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "bookmarks"]

[tool.ruff.lint.per-file-ignores]
# Django settings: late imports + long AUTH_PASSWORD_VALIDATORS / LOGGING strings.
"app/settings.py" = ["E402", "E501"]
