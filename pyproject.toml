[project]
name = "bunnify"
version = "0.12.1"
description = "Smart bookmark manager and URL shortcut system"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Henrique Andrade" },
]
requires-python = ">=3.14"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "asgiref==3.12.1",
    "click>=8.5.0",
    "django>=6.1",
    "jsonschema>=4.26.0",
    "packaging>=26.3",
    "pathspec==1.1.1",
    "platformdirs>=4.11.4",
    "prompt-toolkit>=3.0.53",
    "rpds-py>=2026.6.3",
    "sqlparse>=0.6.0",
    "typing-extensions==4.16.0",
]

[project.optional-dependencies]
macos = [
    "pyobjc-core>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=12.2.2; sys_platform == 'darwin'",
]

[project.scripts]
bunnify = "app.cli:main"
bunnify-server = "app.server_cli:main"
spotty-bunny = "app.spotty_bunny_cli:main"

[project.urls]
Changelog = "https://github.com/the-hcma/bunnify/blob/main/CHANGELOG.md"
"Chrome / Edge setup" = "https://github.com/the-hcma/bunnify/blob/main/CHROME_SETUP.md"
Homepage = "https://github.com/the-hcma/bunnify"
Issues = "https://github.com/the-hcma/bunnify/issues"
Repository = "https://github.com/the-hcma/bunnify"
"Server setup" = "https://github.com/the-hcma/bunnify/blob/main/docs/LOCAL.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "bookmarks"]

[tool.hatch.build.targets.wheel.force-include]
"bunnify.json.example" = "app/data/bookmarks.example.json"

[tool.hatch.build.targets.sdist]
packages = ["app", "bookmarks"]

# Keep the repo-root path inside the sdist so `uv build` (wheel-from-sdist) can
# still resolve the wheel force-include source path above.
[tool.hatch.build.targets.sdist.force-include]
"bunnify.json.example" = "bunnify.json.example"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.4",
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
exclude = ["**/migrations", "**/.venv", "**/venv"]
# Django has dynamic attributes and patterns that don't match strict typing
reportAttributeAccessIssue = "none"
reportIndexIssue = "none"
reportCallIssue = "none"
reportOptionalMemberAccess = "none"
reportArgumentType = "none"  # Django HttpResponse accepts str, pyright thinks bytes

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["**/migrations"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
# Replaces black/isort-adjacent flake8 E/F and isort (I). Pyright remains for types.
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "bookmarks"]

[tool.ruff.lint.per-file-ignores]
# Django settings: late imports + long AUTH_PASSWORD_VALIDATORS / LOGGING strings.
"app/settings.py" = ["E402", "E501"]
