<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bunnify{% endblock %}</title>
    <link rel="search" type="application/opensearchdescription+xml" title="Bookmarks" href="/opensearch.xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            display: flex;
            min-height: 100vh;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 2rem 1rem;
            width: 200px;
            position: fixed;
            height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }
        .brand {
            cursor: default;
            position: relative;
            display: inline-block;
        }
        .build-version {
            color: #aeb6bf;
            font-size: 0.8rem;
            margin: 0.35rem 0 0;
        }
        .brand[data-commit]::after {
            content: attr(data-commit);
            position: absolute;
            left: 0;
            top: calc(100% + 0.35rem);
            z-index: 2;
            white-space: nowrap;
            padding: 0.35rem 0.5rem;
            border-radius: 4px;
            background: #1a252f;
            color: #ecf0f1;
            font-size: 0.7rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.05s ease-in;
        }
        .brand[data-commit]:hover::after,
        .brand[data-commit]:focus-visible::after {
            opacity: 1;
        }
        nav {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        nav a {
            color: #3498db;
            text-decoration: none;
            padding: 0.75rem 1rem;
            background-color: white;
            border-radius: 4px;
            text-align: center;
        }
        nav a:hover {
            background-color: #ecf0f1;
        }
        .content {
            margin-left: 200px;
            flex: 1;
            background-color: white;
            padding: 2rem;
            box-shadow: -2px 0 4px rgba(0,0,0,0.1);
        }
        code {
            background-color: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
        pre {
            background-color: #f4f4f4;
            padding: 1rem;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand" data-commit="commit {{ git_commit }}" tabindex="0">
            <h1>🐰 Bunnify</h1>
            {% if package_version %}
                <p class="build-version">{{ package_version }}</p>
            {% endif %}
        </div>
        <nav>
            <a href="/">Home</a>
            <a href="/list/">All Bookmarks</a>
        </nav>
    </header>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
