name: Bunnify CI

on:
  # Omitting push: main — the merge queue already validates the integrated
  # state before landing; a second run after merge duplicates work without
  # adding signal.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
    branches-ignore:
      - '**/graphite-base/**'



  push:
    branches-ignore:
      - main
      - '**/graphite-base/**'
# Cancel in-progress reruns for the same trigger only. push and pull_request must
# not share a group: cancel-in-progress would leave CANCELLED required checks on
# the PR commit and block merge even when pull_request CI passed. pull_request
# actions are also split (opened/synchronize vs edited) so review-bot description
# patches do not cancel an in-flight test run for the same commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.event.action || github.event_name }}
  cancel-in-progress: true
jobs:
  guard:
    permissions:
      contents: read
      pull-requests: read
    name: Guard
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Skip merge-queue staging branches — the merge queue validates the
          # integrated state itself; CI there duplicates work.
          if [[ "${HEAD_REF}" == gtmq_merge_* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Skip when the PR is already merged — Graphite pushes a restack
          # commit to the next branch after a merge lands, which would otherwise
          # trigger a redundant CI run on an already-validated diff.
          if [[ -n "${PR_NUMBER}" ]]; then
            state=$(gh pr view "${PR_NUMBER}" --repo "${REPOSITORY}" --json state -q .state 2>/dev/null || true)
            if [[ "${state}" == "MERGED" ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi


          # CodeRabbit appends review summaries to the PR description (pull_request
          # edited). We want its review comments only, not a second full CI run.
          if [[ "${{ github.event_name }}" == "pull_request" ]] \
              && [[ "${{ github.event.action }}" == "edited" ]] \
              && [[ "${{ github.event.sender.login }}" == "coderabbitai[bot]" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Pull request CI skipped: CodeRabbit description edit (review metadata only)"
            exit 0
          fi
          # Skip push CI when an open PR already covers this branch.
          # GitHub always delivers pull_request synchronize for PR-head pushes;
          # the push trigger is only for restacks without an open PR.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BRANCH="${GITHUB_REF#refs/heads/}"
            PR_COUNT=0
            if count="$(gh pr list --repo "$GITHUB_REPOSITORY" \
                --head "$BRANCH" --state open \
                --json number --jq 'length' 2>/dev/null)"; then
              PR_COUNT="$count"
            fi
            if [[ "$PR_COUNT" -gt 0 ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Push CI skipped: open PR exists; pull_request handles this push"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
  lint-python:
    name: Python lint & format checks
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.3

    - name: Install uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        version: "latest"

    - name: Set up Python 3.14
      run: uv python install 3.14

    - name: Install dependencies (including dev)
      run: uv sync --all-groups

    - name: Check import sorting (isort)
      run: uv run isort --check-only --diff .

    - name: Check formatting (black)
      run: uv run black --check .

    - name: Type check (pyright)
      run: uv run pyright --warnings

  lint-shell:
    name: Shell script linting
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.3

    - name: Install shellcheck
      run: sudo apt-get update && sudo apt-get install -y shellcheck

    - name: Lint bash scripts with shellcheck
      run: |
        shellcheck bunnify-server
        shellcheck test_integration
        if [ -d scripts ]; then find scripts -type f | xargs shellcheck; fi

  test:
    name: Tests & validations
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.3

    - name: Install uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        version: "latest"

    - name: Set up Python 3.14
      run: uv python install 3.14

    - name: Install dependencies
      run: uv sync --all-groups

    - name: Run Django checks
      run: uv run python manage.py check

    - name: Run migrations
      run: uv run python manage.py migrate

    - name: Validate example bookmark file
      run: |
        cp bunnify.json.example /tmp/test_bookmarks.json
        uv run python manage.py load_bookmarks --file /tmp/test_bookmarks.json

    - name: Validate bunnify-server script
      run: ./bunnify-server --help

    - name: Run unit tests
      run: ./test_bunnify

    - name: Run integration script (timeout protected)
      run: |
        chmod +x ./test_integration
        ./test_integration
  secret-scan:
    name: Secret Scan
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Secret Scan
        env:
          GITLEAKS_BASE: ${{ github.event.pull_request.base.sha || '' }}
          GITLEAKS_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/ci/secret-scan
